name: Auto Grade

on:
  push:
    branches: [ main ]

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Run tests
        # Replace 'test.py' with your actual path if it's inside a 'tests' folder!
        run: |
          python tests/test_assignment.py | tee result.txt
      
      - name: Show results in summary
        if: always()
        run: |
          echo "## 🧪 Grading Results" >> $GITHUB_STEP_SUMMARY
          cat result.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Score Artifact for Cyberflix
        uses: actions/upload-artifact@v4
        if: always()  # Crucial: Uploads the score even if some tests failed!
        with:
          name: auto-grading-result
          path: score.json
          retention-days: 7
